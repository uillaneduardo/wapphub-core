services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wapphub
      POSTGRES_USER: wapphub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
    volumes:
      - core_next_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wapphub -d wapphub"]
      interval: 10s
      timeout: 3s
      retries: 5
  api:
    build: .
    environment:
      PORT: 3080
      DATABASE_URL: postgresql://wapphub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/wapphub
    ports:
      - "127.0.0.1:3080:3080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3
volumes:
  core_next_pg:
