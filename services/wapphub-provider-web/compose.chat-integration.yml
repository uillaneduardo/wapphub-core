# Explicit CP3 overlay. Allows QR only after an authenticated Core command.
services:
  provider-web:
    environment:
      ALLOW_SESSION_CONNECT: 'true'
      PROVIDER_SYNC_ENABLED: 'true'
      # Extensive real import requires a separately authorized bounded operation.
      PROVIDER_HISTORY_ENABLED: 'false'
      PROVIDER_HISTORY_EXECUTION_ENABLED: ${PROVIDER_HISTORY_EXECUTION_ENABLED:-false}
      PROVIDER_HISTORY_SCOPED_AUTHORIZATION: 'true'
